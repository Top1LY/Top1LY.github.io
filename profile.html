<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主播主页 · 主播歌单站</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="wrap">
  <div style="margin-bottom:18px">
    <a class="link-quiet" href="index.html">← 回到主播大厅</a>
  </div>

  <div id="profile" hidden>
    <section class="hero" id="hero">
      <span class="hero-avatar" id="heroAvatar"><span id="heroInitial"></span></span>
      <div class="hero-info">
        <h1 id="heroName"></h1>
        <div class="hero-handle" id="heroHandle"></div>
        <p class="hero-intro" id="heroIntro"></p>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary" id="btnLive" target="_blank" rel="noopener">进入直播间</a>
        <a class="btn btn-ghost" id="btnSpace" target="_blank" rel="noopener">B站主页</a>
        <a class="link-quiet" href="#obs">复制 OBS 地址 ↓</a>
      </div>
    </section>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2 id="songTitle">完整歌单</h2>
          <span id="songCount"></span>
        </div>

        <div class="filter" id="filter" hidden>
          <div class="filter-top">
            <div class="search">
              <svg class="search-ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <circle cx="8.5" cy="8.5" r="5.5"></circle>
                <path d="M12.9 12.9 17 17"></path>
              </svg>
              <input type="search" id="q" autocomplete="off"
                     placeholder="搜歌名 / 歌手 / 标签，空格可分词">
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="clearFilter" hidden>清空筛选</button>
          </div>

          <div class="tagbar" id="tagbar"></div>
          <div class="filter-stat" id="filterStat"></div>
        </div>

        <div class="songs" id="songs"></div>
      </section>

      <aside class="side">
        <div class="panel" id="obs">
          <h2>OBS 悬浮层</h2>
          <p>歌单要贴到直播画面上，用的是「悬浮层」地址。它不摆在这里——一串带参数的地址摊在歌单页上既容易被误复制，也会把页面占满。</p>
          <p>外观、配色、滤镜、筛选都在配置页里调，调好一键复制。</p>

          <a class="btn btn-primary btn-block" id="btnStudio">进入 OBS 地址配置页 →</a>
          <div class="card-foot" style="margin-top:10px; gap:8px">
            <a class="btn btn-ghost btn-sm" id="btnPreview" target="_blank" rel="noopener">先看悬浮层效果</a>
          </div>

          <p class="side-hint" style="margin-top:12px">
            配置页里还能生成「只看某一类标签」的地址，OBS 里切场景就等于切歌单。
          </p>
        </div>

        <div class="panel">
          <h2>同站其他主播</h2>
          <div id="others"></div>
        </div>
      </aside>
    </div>
  </div>

  <div class="state" id="state">加载中…</div>
</div>

<script src="assets/theme.js"></script>
<script src="assets/common.js"></script>
<script src="assets/profile.js"></script>
</body>
</html>
